name: Exu-UI Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap source and security patch
        shell: pwsh
        run: |
          if (-not (Test-Path 'src/_boot.js')) {
            $up = Join-Path $env:RUNNER_TEMP 'edex-upstream'
            git clone --depth 1 https://github.com/GitSquared/edex-ui.git $up
            Get-ChildItem -Force $up | Where-Object { $_.Name -ne '.git' } | Copy-Item -Destination . -Recurse -Force

            Remove-Item '.github/workflows/build-binaries.yaml' -Force -ErrorAction SilentlyContinue
            Remove-Item '.github/workflows/codeql-analysis.yml' -Force -ErrorAction SilentlyContinue

            $path = 'src/classes/terminal.class.js'
            $text = Get-Content $path -Raw
            $old = @'
                verifyClient: info => {
                    if (this.wss.clients.length >= 1) {
                        return false;
                    } else {
                        return true;
                    }
                }
'@
            $new = @'
                verifyClient: info => {
                    // CVE-2023-30856: prevent cross-site WebSocket hijacking.
                    const origin = info && info.req && info.req.headers ? info.req.headers.origin : undefined;
                    if (origin !== "file://") {
                        console.warn("[Exu-UI] Blocked WebSocket origin:", origin || "<missing>");
                        return false;
                    }
                    if (this.wss.clients.length >= 1) {
                        return false;
                    }
                    return true;
                }
'@
            if (-not $text.Contains($old)) { throw 'CVE patch target not found' }
            Set-Content $path ($text.Replace($old, $new)) -NoNewline

            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.name = 'exu-ui'
            $pkg.productName = 'Exu-UI'
            $pkg.description = 'Exu-UI security-hardened sci-fi terminal emulator'
            $pkg.repository.url = 'git+https://github.com/exu-coder/Exu-ui.git'
            $pkg.bugs.url = 'https://github.com/exu-coder/Exu-ui/issues'
            $pkg.homepage = 'https://github.com/exu-coder/Exu-ui'
            $pkg.build.appId = 'com.exu.ui'
            $pkg.build.productName = 'Exu-UI'
            $pkg.build.publish = $false
            $pkg.build.artifactName = 'Exu-UI-${os}-${arch}.${ext}'
            $pkg.build.nsis.artifactName = 'Exu-UI-Windows-${arch}.exe'
            $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json

            $src = Get-Content src/package.json -Raw | ConvertFrom-Json
            $src.name = 'exu-ui'
            $src.productName = 'Exu-UI'
            $src.description = 'Exu-UI sci-fi terminal interface'
            $src.repository.url = 'git+https://github.com/exu-coder/Exu-ui.git'
            $src.bugs.url = 'https://github.com/exu-coder/Exu-ui/issues'
            $src.homepage = 'https://github.com/exu-coder/Exu-ui'
            $src | ConvertTo-Json -Depth 20 | Set-Content src/package.json

            @'
# Exu-UI

Security-hardened continuation of the archived eDEX-UI codebase.

## CVE-2023-30856

Exu-UI rejects terminal WebSocket connections unless the Electron `file://` origin is present. HTTP, HTTPS, missing, and other origins are rejected during the handshake.

## Credits and license

Maintained and distributed by **Exu / exu-coder**. The upstream eDEX-UI code is GPL-3.0 licensed and its original copyright/license notices are retained as required by that license.

## Windows

Download the `.exe` from GitHub Releases. End users do not need Git, Node.js, npm, or a command prompt.
'@ | Set-Content README.md

            @'
# Exu-UI Security Patch

Exu-UI addresses CVE-2023-30856, a cross-site WebSocket hijacking vulnerability in eDEX-UI <= 2.2.8.

The terminal WebSocket handshake now requires an exact Electron `file://` Origin. Connections from normal web pages and connections without an Origin are rejected before they can reach the shell.

This is a targeted fix for CVE-2023-30856. The legacy dependency tree should still be treated as unmaintained software and reviewed separately.
'@ | Set-Content SECURITY-PATCH.md

            git config user.name 'Exu'
            git config user.email 'exu-coder@users.noreply.github.com'
            git add -A
            git commit -m 'Import Exu-UI source and fix CVE-2023-30856 [skip ci]'
            git push origin HEAD:main
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16.20.2
          cache: npm

      - name: Install root dependencies
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Install application dependencies
        shell: pwsh
        run: |
          Set-Location src
          npm install --ignore-scripts --no-audit --no-fund
          Set-Location ..

      - name: Rebuild node-pty
        shell: pwsh
        run: .\node_modules\.bin\electron-rebuild.cmd -f -w node-pty -v 12.1.0

      - name: Build installer
        shell: pwsh
        run: .\node_modules\.bin\electron-builder.cmd --win nsis --x64 --publish never --config.directories.app=src --config.appId=com.exu.ui --config.productName=Exu-UI --config.nsis.artifactName=Exu-UI-Windows-x64.exe

      - name: Verify installer
        shell: pwsh
        run: |
          $file = Get-ChildItem dist -Filter 'Exu-UI-Windows-x64.exe' -File | Select-Object -First 1
          if (-not $file) { throw 'Exu-UI-Windows-x64.exe was not created' }
          Write-Host "Installer: $($file.FullName)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Exu-UI-Windows-x64
          path: dist/Exu-UI-Windows-x64.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.8-exu.1
          name: Exu-UI v2.2.8-exu.1
          body: |
            Exu-UI security release.
            - CVE-2023-30856 WebSocket origin validation fix.
            - Windows x64 NSIS installer.
            - GPL-3.0 upstream attribution retained.
          files: dist/Exu-UI-Windows-x64.exe
          prerelease: false
          draft: false
